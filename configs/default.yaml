# Default configuration for poetry generation system

model:
  name: "gpt2"
  max_length: 150
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  no_repeat_ngram_size: 2
  do_sample: true
  pad_token_id: null

training:
  batch_size: 8
  learning_rate: 5e-5
  num_epochs: 3
  warmup_steps: 100
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  save_steps: 500
  eval_steps: 250
  logging_steps: 50

data:
  dataset_name: "poetry_dataset"
  max_length: 128
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  cache_dir: "./data/cache"

evaluation:
  metrics: ["perplexity", "bleu", "rouge", "bert_score"]
  num_samples: 100
  max_eval_length: 100

paths:
  data_dir: "./data"
  output_dir: "./outputs"
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

device:
  auto_detect: true
  device_type: "auto"  # auto, cuda, mps, cpu

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
